name: tilevision
description: Mobile app for visualizing tiles on room floors
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Material Design
  cupertino_icons: ^1.0.2
  
  # Image handling
  image_picker: ^1.0.4
  
  # HTTP requests
  http: ^1.1.0
  
  # State management
  provider: ^6.0.5
  
  # File system
  path_provider: ^2.1.1
  
  # Sharing functionality
  share_plus: ^7.2.1
  url_launcher: ^6.2.5
  
  # Gallery save
  image_gallery_saver: ^2.0.3
  permission_handler: ^11.0.0
  
  # Network connectivity
  connectivity_plus: ^5.0.2
  
  # Image caching
  cached_network_image: ^3.3.0
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Supabase for authentication and database
  supabase_flutter: ^2.5.4
  
  # Environment variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/
    - assets/tiles/
    - .env
