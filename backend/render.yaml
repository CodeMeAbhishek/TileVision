services:
  - type: web
    name: tilevision-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false  # Set this manually in Render dashboard
      - key: PORT
        value: 10000  # Render assigns port automatically, but this is a fallback
      - key: DEBUG
        value: false
      - key: MAX_IMAGE_SIZE
        value: 1024
    healthCheckPath: /health
    plan: free

