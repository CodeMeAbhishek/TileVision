services:
  - type: web
    name: tilevision-backend
    env: python
    # NOTE: Python version must be set manually in Render Dashboard (Settings → Python Version → 3.11.9)
    # render.yaml doesn't support pythonVersion field, so set it in the dashboard UI
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: REPLICATE_API_TOKEN
        sync: false  # Set this manually in Render dashboard
      - key: PORT
        value: 10000  # Render assigns port automatically, but this is a fallback
      - key: DEBUG
        value: false
      - key: MAX_IMAGE_SIZE
        value: 10  # Max image size in MB (default: 10MB)
      - key: ALLOWED_ORIGINS
        value: "*"  # CORS origins - use "*" for testing, specific domains for production
      - key: BASE_URL
        value: https://tilevision.onrender.com  # Base URL for tile images
    healthCheckPath: /health
    plan: free

